name: Capy Entries — Race Card (排位表)

# Runs EntryList_Scraper.py to fetch HKJC's 排位表 for the next meeting.
# Writes entries/today_entries.txt (consumed by Pool A comeback override)
# and entries/entries_<YYYY-MM-DD>.txt (dated archive).
#
# Auto-mode: HK 20:00 Mon / Tue / Sat (night before each meeting).

on:
  schedule:
    # HK 20:00 Mon,Tue,Sat = UTC 12:00 Mon,Tue,Sat
    - cron: '0 12 * * 1,2,6'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  season_gate:
    # 休季自動化 (2026-08-18): scheduled runs short-circuit during the HK
    # off-season. Status comes from the backend /api/season (D1-derived:
    # no future ST/HV meeting + >12-day gap = off_season; admin override
    # via app_settings season_mode). Fail-open: any curl/parse failure is
    # treated as in_season so we never skip a real race day. Manual
    # dispatch / workflow_run triggers are NEVER gated.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        name: Season gate (off-season auto-pause)
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STATUS=$(curl -sf --max-time 20 "https://tianxi-backend.tianxi-entertainment.workers.dev/api/season" | grep -o '"status":"[a-z_]*"' | head -1 | cut -d'"' -f4 || true)
            echo "season status: ${STATUS:-unknown (fail-open)}"
            if [ "$STATUS" = "off_season" ]; then
              SKIP=true
              echo "::notice::休季中 off-season — skipping scheduled run (auto-resumes when the new season racecard appears)"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  entries:
    needs: season_gate
    if: needs.season_gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-flight — fixture guard (tomorrow is race day?)
        id: guard
        run: bash scripts/fixture_guard.sh --window 3 --direction future

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Setup Chrome
        id: chrome
        if: steps.guard.outputs.run == 'true'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup ChromeDriver
        if: steps.guard.outputs.run == 'true'
        uses: nanasess/setup-chromedriver@v2

      - name: Export browser paths
        if: steps.guard.outputs.run == 'true'
        run: |
          echo "CHROMIUM_PATH=${{ steps.chrome.outputs.chrome-path }}" >> $GITHUB_ENV
          echo "CHROMEDRIVER_PATH=$(which chromedriver)" >> $GITHUB_ENV

      - name: Install Python deps
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run entries scraper
        if: steps.guard.outputs.run == 'true'
        run: python EntryList_Scraper.py

      - name: Push entries to main
        if: steps.guard.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python git_sync.py \
            --message "[data][skip ci] entries $(date -u +%Y-%m-%dT%H:%MZ) via GHA"
