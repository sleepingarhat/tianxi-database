name: Capy D1 Sync Pool A — trackwork + injury + form

# After capy_pool_a.yml commits fresh trackwork / injury / form_records CSVs,
# this workflow ingests them into a scratch bulk-local.db and pushes the
# delta to remote Cloudflare D1 (horse_trackwork / horse_injury / horse_form_records
# tables, plus any new horses referenced).
#
# Triggered automatically when capy_pool_a succeeds. Also supports
# workflow_dispatch with an explicit --since window.

on:
  # Cron fallback — workflow_run chain has silently missed every pool_a run
  # since 2026-04-30 (total_count=0). Fires ~1h after Pool A's 04:00 HK scrape.
  schedule:
    - cron: '17 21 * * *'   # 05:17 HK
  workflow_dispatch:
    inputs:
      since:
        description: 'Lookback YYYY-MM-DD (rows with date >= this value; blank = 30 days back)'
        required: false
        default: ''
  workflow_run:
    workflows: ['Capy Pool A — Horse Profiles + Trackwork + Injury']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  season_gate:
    # 休季自動化 (2026-08-18): scheduled runs short-circuit during the HK
    # off-season. Status comes from the backend /api/season (D1-derived:
    # no future ST/HV meeting + >12-day gap = off_season; admin override
    # via app_settings season_mode). Fail-open: any curl/parse failure is
    # treated as in_season so we never skip a real race day. Manual
    # dispatch / workflow_run triggers are NEVER gated.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        name: Season gate (off-season auto-pause)
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STATUS=$(curl -sf --max-time 20 "https://tianxi-backend.tianxi-entertainment.workers.dev/api/season" | grep -o '"status":"[a-z_]*"' | head -1 | cut -d'"' -f4 || true)
            echo "season status: ${STATUS:-unknown (fail-open)}"
            if [ "$STATUS" = "off_season" ]; then
              SKIP=true
              echo "::notice::休季中 off-season — skipping scheduled run (auto-resumes when the new season racecard appears)"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  sync-pool-a:
    needs: season_gate
    if: >-
      needs.season_gate.outputs.skip != 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout tianxi-database (CSV source)
        uses: actions/checkout@v4
        with:
          path: tianxi-database
          fetch-depth: 1

      - name: Checkout tianxi-backend (ingest + push scripts)
        uses: actions/checkout@v4
        with:
          repository: sleepingarhat/tianxi-backend
          path: tianxi-backend
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve --since window
        id: resolve
        env:
          INPUT_SINCE: ${{ github.event.inputs.since }}
        run: |
          set -eu
          S="$INPUT_SINCE"
          if [ -z "$S" ]; then
            # 30-day lookback default to catch any recent trackwork/injury entries
            S=$(TZ=Asia/Hong_Kong date -d "today -30 days" +%Y-%m-%d)
          fi
          if ! printf '%s' "$S" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "Invalid since date: $S" >&2
            exit 2
          fi
          echo "since=$S" >> $GITHUB_OUTPUT
          echo "Resolved --since=$S"

      - name: Install tianxi-backend deps
        working-directory: tianxi-backend
        run: npm install --no-audit --no-fund

      - name: Ingest Pool A sources (profiles + form + trackwork + injury)
        working-directory: tianxi-backend
        run: |
          set -eu
          rm -f bulk-local.db
          # scripts/ingest/index.ts handles profiles/form/trackwork/injury
          npx tsx scripts/ingest/index.ts \
            profiles form trackwork injury \
            --data-dir=../tianxi-database \
            --db=bulk-local.db

      - name: Generate Pool A delta SQL chunks
        working-directory: tianxi-backend
        env:
          SINCE: ${{ steps.resolve.outputs.since }}
        run: |
          set -eu
          rm -rf /tmp/d1-delta
          npx tsx scripts/push-delta.ts \
            --db=bulk-local.db \
            --since="$SINCE" \
            --include=pool-a \
            --out=/tmp/d1-delta
          ls -la /tmp/d1-delta/ | head -30 || echo "(no chunks)"

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Ensure fixed-profile columns exist in D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        working-directory: tianxi-backend
        run: |
          set -eu
          INFO=$(wrangler d1 execute tianxi-db --remote --command="PRAGMA table_info(horse_profile_extra)" --json)
          for SPEC in \
            "season_stakes_raw TEXT" \
            "season_stakes_int INTEGER" \
            "current_trainer TEXT" \
            "profile_checked_at TEXT"; do
            COL=${SPEC%% *}
            if printf '%s' "$INFO" | grep -q "\"name\": \"$COL\""; then
              echo "exists: horse_profile_extra.$COL"
            else
              wrangler d1 execute tianxi-db --remote \
                --command="ALTER TABLE horse_profile_extra ADD COLUMN $SPEC"
            fi
          done

      - name: Canonicalize legacy D1 horse IDs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        working-directory: tianxi-backend
        run: |
          set -euo pipefail
          wrangler d1 execute tianxi-db --remote \
            --file=scripts/migrate-horse-ids-d1-prepare.sql

          TABLES=$(wrangler d1 execute tianxi-db --remote --json \
            --command="SELECT name FROM sqlite_master WHERE type = 'table' AND sql LIKE '%horse_id%' ORDER BY name" \
            | jq -r '.[].results[]?.name')
          while IFS= read -r TABLE; do
            [ -n "$TABLE" ] || continue
            if ! printf '%s' "$TABLE" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
              echo "Unsafe table name returned by sqlite_master: $TABLE" >&2
              exit 2
            fi
            echo "canonicalizing $TABLE.horse_id"
            wrangler d1 execute tianxi-db --remote \
              --command="UPDATE \"$TABLE\" SET horse_id = (SELECT new_id FROM _horse_id_migration WHERE old_id = \"$TABLE\".horse_id) WHERE horse_id IN (SELECT old_id FROM _horse_id_migration)"
          done <<< "$TABLES"

          wrangler d1 execute tianxi-db --remote \
            --file=scripts/migrate-horse-ids-d1-finalize.sql
          REMAINING=$(wrangler d1 execute tianxi-db --remote --json \
            --command="SELECT COUNT(*) AS count FROM horses WHERE id = code AND id NOT LIKE 'horse_%'" \
            | jq -r '.[0].results[0].count')
          test "$REMAINING" = "0"

      - name: Push Pool A delta to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        working-directory: tianxi-backend
        run: |
          set -eu
          # FK-parent-first order
          ORDER=(horses horse_profile_extra horse_trackwork horse_injury horse_form_records)
          FAILED=0
          for t in "${ORDER[@]}"; do
            for f in /tmp/d1-delta/${t}-*.sql; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              if wrangler d1 execute tianxi-db --remote --file="$f" >/tmp/out.log 2>&1; then
                echo "OK  $base"
              else
                echo "FAIL $base"
                tail -20 /tmp/out.log
                FAILED=1
              fi
            done
          done
          if [ "$FAILED" -eq 1 ]; then exit 1; fi

      - name: Verify D1 post-push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -eu
          wrangler d1 execute tianxi-db --remote \
            --command="SELECT 'horse_profile_extra' AS tbl, COUNT(*) AS rows FROM horse_profile_extra UNION ALL SELECT 'horse_trackwork', COUNT(*) FROM horse_trackwork UNION ALL SELECT 'horse_injury', COUNT(*) FROM horse_injury UNION ALL SELECT 'horse_form_records', COUNT(*) FROM horse_form_records" \
            --json | tail -40
