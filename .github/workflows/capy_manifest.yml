name: capy-manifest-build

# Auto-regenerate data/index.json whenever repo data changes.
# Runs on: push to main touching data stores, daily cron, or manual dispatch.
# The manifest is the SSOT for frontends to discover what data exists.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "horses/**"
      - "jockeys/**"
      - "trainers/**"
      - "trials/**"
      - "entries/**"
      - "audit_reports/integrity_latest.json"
      - "tools/build_manifest.py"
      - ".github/workflows/capy_manifest.yml"
  schedule:
    - cron: "15 4 * * *"  # daily HK 12:15 (after sanity + audit)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: capy-manifest
  cancel-in-progress: false

jobs:
  season_gate:
    # 休季自動化 (2026-08-18): scheduled runs short-circuit during the HK
    # off-season. Status comes from the backend /api/season (D1-derived:
    # no future ST/HV meeting + >12-day gap = off_season; admin override
    # via app_settings season_mode). Fail-open: any curl/parse failure is
    # treated as in_season so we never skip a real race day. Manual
    # dispatch / workflow_run triggers are NEVER gated.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        name: Season gate (off-season auto-pause)
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STATUS=$(curl -sf --max-time 20 "https://tianxi-backend.tianxi-entertainment.workers.dev/api/season" | grep -o '"status":"[a-z_]*"' | head -1 | cut -d'"' -f4 || true)
            echo "season status: ${STATUS:-unknown (fail-open)}"
            if [ "$STATUS" = "off_season" ]; then
              SKIP=true
              echo "::notice::休季中 off-season — skipping scheduled run (auto-resumes when the new season racecard appears)"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  build:
    needs: season_gate
    if: needs.season_gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build manifest
        run: python3 tools/build_manifest.py

      - name: Diff check
        id: diff
        run: |
          if git diff --quiet -- data/index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[manifest] no changes"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "[manifest] changes detected"
            git --no-pager diff --stat -- data/index.json
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "capy-bot"
          git config user.email "capy-bot@users.noreply.github.com"
          # data/index.json is 100% derived, so a concurrent write is never a
          # real conflict: on any race we reset to origin/main, REGENERATE from
          # the fresh tree, and re-commit. Rebasing a generated file只會撞衝突。
          for i in 1 2 3 4 5; do
            git add data/index.json
            git commit -m "[manifest][skip ci] regenerate data/index.json" || true
            if git push origin HEAD:main; then exit 0; fi
            echo "push retry $i — refreshing from origin/main"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python3 tools/build_manifest.py
            if git diff --quiet -- data/index.json; then
              echo "[manifest] manifest already up to date on origin/main"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ github.run_id }}
          path: data/index.json
          retention-days: 30
