name: SpeedPro Speed Guide Scrape

# Store-only: archives HKJC's pre-race SpeedPro 速勢圖 energy/form data per race
# day into speedpro/data/. NOT fed into the engine. HKJC only publishes the
# current meeting (no historical backfill), so this must run on race days going
# forward; the scraper self-guards on sg_index.expiredate and HK venue (ST/HV).

on:
  schedule:
    - cron: '0 1 * * *'   # 09:00 HKT
    - cron: '0 3 * * *'   # 11:00 HKT (catches race-morning scratchings)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: speedpro-scrape
  cancel-in-progress: false

jobs:
  season_gate:
    # 休季自動化 (2026-08-18): scheduled runs short-circuit during the HK
    # off-season. Status comes from the backend /api/season (D1-derived:
    # no future ST/HV meeting + >12-day gap = off_season; admin override
    # via app_settings season_mode). Fail-open: any curl/parse failure is
    # treated as in_season so we never skip a real race day. Manual
    # dispatch / workflow_run triggers are NEVER gated.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        name: Season gate (off-season auto-pause)
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            STATUS=$(curl -sf --max-time 20 "https://tianxi-backend.tianxi-entertainment.workers.dev/api/season" | grep -o '"status":"[a-z_]*"' | head -1 | cut -d'"' -f4 || true)
            echo "season status: ${STATUS:-unknown (fail-open)}"
            if [ "$STATUS" = "off_season" ]; then
              SKIP=true
              echo "::notice::休季中 off-season — skipping scheduled run (auto-resumes when the new season racecard appears)"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

  scrape:
    needs: season_gate
    if: needs.season_gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrape SpeedPro speed guide
        run: python speedpro/scrape_speedpro.py
      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "speedpro: update speed-guide data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "No SpeedPro change."
          fi
